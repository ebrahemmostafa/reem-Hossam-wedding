  <body style="overflow-x: hidden;">
    <div id="root"></div>
    <audio id="background-music" loop preload="auto">
      <source src="./assets/ahwak-piano.mp3" type="audio/mpeg">
    </audio>
    <button id="music-toggle" class="music-toggle" type="button" aria-label="Play background music" aria-pressed="false" title="Play background music">
      <span aria-hidden="true">&#9835;</span>
    </button>
    <button id="lang-toggle" class="lang-toggle" type="button" aria-label="Switch language to Arabic" title="Switch language to Arabic">
      <span aria-hidden="true">🌐</span>
      <span id="lang-label" class="lang-label">عربي</span>
    </button>
    <script>
      (() => {
        const music = document.getElementById('background-music');
        const toggle = document.getElementById('music-toggle');

        music.volume = 0.35;

        const updateToggle = () => {
          const isPlaying = !music.paused;
          toggle.setAttribute('aria-pressed', String(isPlaying));
          toggle.setAttribute('aria-label', isPlaying ? 'Pause background music' : 'Play background music');
          toggle.title = isPlaying ? 'Pause background music' : 'Play background music';
        };

        const playMusic = () => music.play().then(updateToggle).catch(updateToggle);

        toggle.addEventListener('click', () => {
          if (music.paused) playMusic();
          else music.pause();
        });

        music.addEventListener('play', updateToggle);
        music.addEventListener('pause', updateToggle);
        document.addEventListener('pointerdown', playMusic, { once: true });
        playMusic();
      })();
    </script>

          "Your RSVP has been sent successfully.": "تم إرسال تأكيد حضورك بنجاح.",
          "Please select if you will attend": "يرجى تحديد ما إذا كنت ستحضر",
          "Please enter your full name": "يرجى إدخال اسمك الكامل",
          "Names required": "الأسماء مطلوبة",
          "Please enter the name of all companions.": "يرجى إدخال أسماء جميع المرافقين.",
          "Select...": "اختر...",
          "Tap to open": "اضغط للفتح",
          "Loading…": "جاري التحميل…",
          "Thank you for being part of our special day": "شكراً لكونكم جزءاً من يومنا المميز"
        };

        const AR_TO_EN = {};
        Object.keys(EN_TO_AR).forEach(key => {
          AR_TO_EN[EN_TO_AR[key]] = key;
        });

        let currentLang = localStorage.getItem('wedding_lang') || 'en';

        const translateText = (str, targetLang) => {
          if (!str || typeof str !== 'string') return str;
          const map = targetLang === 'ar' ? EN_TO_AR : AR_TO_EN;
          let out = str;
          Object.keys(map).forEach(key => {
            if (out.includes(key)) {
              out = out.split(key).join(map[key]);
            }
          });
          return out;
        };

        const translateTree = (rootNode, targetLang) => {
          if (!rootNode) return;
          const walker = document.createTreeWalker(
            rootNode,
            NodeFilter.SHOW_TEXT,
            {
              acceptNode: (node) => {
                if (!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
                const parent = node.parentElement;
                if (parent && (parent.tagName === 'SCRIPT' || parent.tagName === 'STYLE' || parent.id === 'lang-toggle')) {
                  return NodeFilter.FILTER_REJECT;
                }
                return NodeFilter.FILTER_ACCEPT;
              }
            }
          );
          let node;
          const nodesToUpdate = [];
          while ((node = walker.nextNode())) {
            const newText = translateText(node.nodeValue, targetLang);
            if (newText !== node.nodeValue) {
              nodesToUpdate.push({ node, newText });
            }
          }
          nodesToUpdate.forEach(({ node, newText }) => {
            node.nodeValue = newText;
          });

          const inputs = rootNode.querySelectorAll ? rootNode.querySelectorAll('input[placeholder], textarea[placeholder]') : [];
          inputs.forEach(input => {
            const ph = input.getAttribute('placeholder');
            if (ph) {
              const newPh = translateText(ph, targetLang);
              if (newPh !== ph) {
                input.setAttribute('placeholder', newPh);
              }
            }
          });
        };

        const toggleBtn = document.getElementById('lang-toggle');
        const langLabel = document.getElementById('lang-label');

        const setLanguage = (lang) => {
          currentLang = lang;
          localStorage.setItem('wedding_lang', lang);
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          if (lang === 'ar') {
            document.documentElement.classList.add('lang-ar');
            document.body.classList.add('lang-ar');
            if (langLabel) langLabel.textContent = 'EN';
            if (toggleBtn) toggleBtn.setAttribute('aria-label', 'Switch language to English');
            if (toggleBtn) toggleBtn.title = 'Switch language to English';
          } else {
            document.documentElement.classList.remove('lang-ar');
            document.body.classList.remove('lang-ar');
            if (langLabel) langLabel.textContent = 'عربي';
            if (toggleBtn) toggleBtn.setAttribute('aria-label', 'Switch language to Arabic');
            if (toggleBtn) toggleBtn.title = 'Switch language to Arabic';
          }
          translateTree(document.body, lang);
        };

        if (toggleBtn) {
          toggleBtn.addEventListener('click', () => {
            const nextLang = currentLang === 'en' ? 'ar' : 'en';
            setLanguage(nextLang);
          });
        }

        const observer = new MutationObserver(() => {
          if (currentLang === 'ar') {
            translateTree(document.body, 'ar');
          }
        });

        window.addEventListener('DOMContentLoaded', () => {
          setLanguage(currentLang);
          observer.observe(document.body, { childList: true, subtree: true });
        });

        setTimeout(() => setLanguage(currentLang), 300);
        setTimeout(() => setLanguage(currentLang), 1000);
      })();
    </script>
